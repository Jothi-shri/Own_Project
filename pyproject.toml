[project]
name = "saas"
version = "0.1.0"
description = "SaaS project with FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
managed = true

[tool.alembic]
script_location = "alembic"
