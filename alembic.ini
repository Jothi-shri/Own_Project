
[alembic]
script_location = %(here)s/alembic


prepend_sys_path = .







path_separator = os



# Never put credentials here. The URL is overridden at runtime from the
# DATABASE_URL environment variable (see alembic/env.py). This value is only
# a placeholder so Alembic has a syntactically valid default offline.
sqlalchemy.url = postgresql+psycopg://USER:PASSWORD@HOST:5432/DATABASE


[post_write_hooks]




[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
